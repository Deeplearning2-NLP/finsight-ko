[project]
name = "finsight"
version = "0.0.1"
description = "Korean DART filing retrieval and numeric verification (DSC3033 final project)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
